<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bidwise link preview</title>
<!-- Source for public/og.png (needs node_modules for the fonts). Render from site/:
"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=out.png file://$PWD/og/og.html -->
<style>
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
:root { --bg:#f4f3ef; --surface:#fff; --text:#23262b; --muted:#646a73; --rule:#e2e0da; --accent:#2d6a5a; --accent-soft:#e3efe9; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--text); display: flex; align-items: center; padding: 0 64px; gap: 40px; }
.left { flex: 1 1 auto; min-width: 0; }
.mark { font-size: 44px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em; margin-bottom: 28px; }
h1 { font-size: 68px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; }
.facts { margin-top: 32px; font-size: 26px; color: var(--muted); }
.card { flex: 0 0 456px; background: var(--surface); border: 2px solid var(--rule); border-radius: 12px; padding: 36px 36px 34px; box-shadow: 0 2px 0 var(--rule); }
.code { font-size: 22px; font-weight: 600; color: var(--accent); }
.title { font-size: 32px; font-weight: 600; line-height: 1.2; margin-top: 6px; }
.sec { font-size: 22px; color: var(--muted); margin-top: 8px; }
hr { border: 0; border-top: 2px solid var(--rule); margin: 28px 0 24px; }
.label { font-size: 22px; color: var(--muted); }
.bid { font-size: 64px; font-weight: 600; line-height: 1.1; margin-top: 2px; letter-spacing: -0.02em; }
.chance { margin-top: 26px; display: flex; justify-content: space-between; align-items: baseline; }
.chance b { font-size: 30px; font-weight: 600; color: var(--accent); }
.bar { height: 14px; border-radius: 7px; background: var(--accent-soft); margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 85%; background: var(--accent); border-radius: 7px; }
</style>
</head>
<body>
  <div class="left">
    <div class="mark">Bidwise</div>
    <h1>Plan your<br>SMU BOSS bids</h1>
    <p class="facts">180,000+ past bids · 776 courses · free</p>
  </div>
  <div class="card">
    <div class="code">COR-COMM1304</div>
    <div class="title">Management Communication</div>
    <div class="sec">Section G2</div>
    <hr>
    <div class="label">Balanced bid</div>
    <div class="bid">e$12.01</div>
    <div class="chance"><span class="label">Chance of a seat</span><b>85%</b></div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
